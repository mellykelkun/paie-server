name: paie-server

services:
  application:
    image: paie-server-application
    build:
      context: .
    container_name: paie-server-application
    env_file:
      - .env
    environment:
      HOTE_BASE_DE_DONNEES: paie-server-postgres
      PORT_BASE_DE_DONNEES: 5432
    ports:
      - "${PORT_PUBLIC_APPLICATION:-3000}:3000"
    volumes:
      - paie-server-preuves:/app/televersements/preuves
    depends_on:
      base-de-donnees:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/sante').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - paie-server-reseau
    restart: unless-stopped

  sandbox:
    image: paie-server-application
    container_name: paie-server-sandbox
    command: npm run sandbox
    env_file:
      - .env
      - .env.sandbox
    environment:
      PORT_SANDBOX: 4000
      URL_API_PAIEMENT_INTERNE: http://paie-server-application:3000
      URL_SANDBOX_WEBHOOK: http://paie-server-sandbox:4000/webhook/paiement
    ports:
      - "${PORT_PUBLIC_SANDBOX:-4000}:4000"
    volumes:
      - paie-server-sandbox-donnees:/app/bac-a-sable/donnees
    depends_on:
      application:
        condition: service_healthy
    networks:
      - paie-server-reseau
    restart: unless-stopped

  base-de-donnees:
    image: postgres:18.6-alpine
    container_name: paie-server-postgres
    environment:
      POSTGRES_DB: ${NOM_BASE_DE_DONNEES:-paie_server}
      POSTGRES_USER: ${UTILISATEUR_BASE_DE_DONNEES:-paie_server}
      POSTGRES_PASSWORD: ${MOT_DE_PASSE_BASE_DE_DONNEES:?MOT_DE_PASSE_BASE_DE_DONNEES manquant}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - paie-server-postgres-donnees:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - paie-server-reseau
    restart: unless-stopped

volumes:
  paie-server-postgres-donnees:
    name: paie-server-postgres-donnees
  paie-server-preuves:
    name: paie-server-preuves
  paie-server-sandbox-donnees:
    name: paie-server-sandbox-donnees

networks:
  paie-server-reseau:
    name: paie-server-reseau
